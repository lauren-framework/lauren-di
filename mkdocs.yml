site_name: lauren-di
site_description: A standalone dependency-injection container — explicit registration, typed scopes, lifecycle hooks, module visibility. Standard library only.
site_author: Platform Engineering Team
site_url: https://lauren-framework.github.io/lauren-di/
repo_url: https://github.com/lauren-framework/lauren-di
repo_name: lauren-framework/lauren-di
copyright: Copyright &copy; 2026 Platform Engineering Team — MIT licensed
exclude_docs: |
  /prds/

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Providers and injection: guides/providers.md
      - Scopes and lifecycle: guides/scopes.md
      - Custom providers and tokens: guides/custom-providers.md
      - Testing and overrides: guides/testing.md
  - Module visibility: visibility.md
  - Errors: errors.md
  - Migration from lauren: migration.md
  - Reference: reference.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
