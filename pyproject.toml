[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lauren-di"
version = "0.1.0"
description = "A standalone dependency-injection container: explicit registration, typed scopes, lifecycle hooks, module visibility. Standard library only."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Platform Engineering Team" }]
maintainers = [{ name = "Platform Engineering Team" }]
keywords = [
    "dependency-injection",
    "di",
    "ioc",
    "container",
    "inversion-of-control",
    "scopes",
    "lifecycle",
    "async",
    "typed",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
#: Runtime dependencies: none. ``lauren_di`` is standard-library only (PRD 01 §2).
dependencies = []

[project.urls]
Homepage = "https://lauren-py.dev"
Documentation = "https://lauren-framework.github.io/lauren-di/"
Repository = "https://github.com/lauren-framework/lauren-di"
Issues = "https://github.com/lauren-framework/lauren-di/issues"
Changelog = "https://github.com/lauren-framework/lauren-di/releases"

# Contributor-only extras (PRD 01 §5.1): exactly `dev`, `release` and `docs` — never
# required by users and never a runtime extra. The normative rule is
# "no runtime extras or runtime dependencies": `dependencies = []` above stays the
# claim a user can verify, and every `Requires-Dist` line in the built wheel is
# `extra ==`-gated. `tests/packaging/test_wheel.py` asserts both halves, and asserts
# this key set equals the one PRD 01 §5.1 documents.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "coverage[toml]>=7.6",
    "mypy>=1.10",
    "ruff>=0.9",
    "nox>=2024.4.15",
    # ``tests/packaging/`` builds the wheel, using the project's own builder.
    "build>=1.2",
]
release = [
    "build>=1.2",
    "twine>=5.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.7",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["lauren_di*"]

[tool.setuptools.package-data]
lauren_di = ["py.typed"]

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: one component in isolation, no event-loop plumbing beyond a single call",
    "integration: several components wired together, including lifecycle and overrides",
    "packaging: builds the distribution and inspects the wheel it produces",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["lauren_di"]
branch = true
# ``lauren_di/_typing/forwardref.py`` is a vendored descendant of the
# standalone ``forwardref_evaluator`` reference implementation: it is
# deliberately defensive (every branch is a fallback for a resolution
# strategy the container never selects) and it is not part of the documented
# public surface, so measuring it distorts the figure the gate is about.
omit = ["lauren_di/_typing/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# ``coverage report --fail-under`` compares the *displayed* total, so precision
# is part of the gate: at the default 0 a measured 84.96 would read as 85 and
# slide past an 85 floor. Two decimals keeps the comparison honest.
precision = 2
# Ratchet. The measured figure is 88.61 % branch coverage (1370 statements,
# 536 branches, 126 missed, 61 partial) over the suite that runs *everywhere*:
# `nox -s coverage` excludes tests/parity, because those cases need an external
# reference checkout and a gate that changes answer depending on whether that
# checkout happens to be present is not a gate (CI measured a lower total than a
# developer with the checkout -- same tree, same commit).
# The figure is also the same whether or not the example frameworks are installed
# (88.61 % either way). It used to read 88.56 % in the gate's own venv, where the
# one line that differed -- `DIError.__repr__` -- was covered only incidentally, by
# an eagerly built assertion message in the framework-adapted conformance drivers;
# `tests/integration/test_error_catalogue.py` now pins that line directly, so the
# number no longer moves with the environment.
# The 85 % target is met, so the gate now sits on it. Raise this number -- never
# lower it -- as tests are added.
fail_under = 85.0
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["lauren_di", "tests", "scripts", "examples", "prds"]
extend-exclude = [
    # Vendored reference implementation — kept byte-comparable with upstream.
    "lauren_di/_typing/forwardref.py",
    # ``prds/evidence/`` holds the throwaway probe scripts behind the ``E-nnn``
    # citations in PRDs 02-08, plus their recorded transcripts. They are *cited
    # evidence*, not scratch: reformatting one would invalidate the id it emits,
    # and ``prds/evidence/run_all.py --check`` diffs the transcripts it produces.
    # That diff is a gate, not a suggestion: ``nox -s prds_evidence`` runs it (about
    # 15 s, no writes), ``nox -s ci`` runs that session, and the ``prds-evidence``
    # job in ``.github/workflows/lint.yml`` runs it on every push — so reformatting
    # a probe here fails a red build that names the file, rather than silently
    # invalidating a citation nobody re-checks.
    # ``tests/unit/test_gitignore_contract.py::EVIDENCE_BASE`` asserts the same
    # files stay committed, and the exclusion is scoped to that directory so the
    # rest of ``prds/`` — notably ``prds/check_consistency.py``, the gate in
    # ``nox -s prds`` — is checked and formatted like any other code.
    "prds/evidence",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # ``ruff format`` owns line width; long lines are prose in docstrings.
    "E501",
    # Ambiguous unicode in docstrings: this project writes about typography.
    "RUF001",
    "RUF002",
    "RUF003",
    # ``__slots__`` is ordered by concern (hot fields first), not alphabetised.
    # RUF022 is deliberately *not* ignored: ``__all__`` must stay sorted (PRD 01 §5.5).
    "RUF023",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
# ``tests/typing/`` holds type-checker fixtures, not runnable test code:
# ``reveal_type`` is a mypy / pyright builtin with no runtime existence, so
# F821 is expected there. The directory is checked by a type checker (see
# PRD 01 §5.6) and is never executed or collected by pytest.
"tests/typing/**" = ["F821"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = false

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
files = ["lauren_di"]
# PRD 01 §5.6: the package is checked in `--strict` mode, and `nox -s typing`
# additionally runs pyright in its own strict mode over the public surface.
# `warn_unused_ignores` is part of `strict` and is deliberately left on: an
# ignore that no longer suppresses anything is a stale comment, and this gate is
# what keeps the remaining ones honest. `mypy==1.20.2` is pinned in `noxfile.py`
# so the checked build is the build CI uses.
strict = true
ignore_missing_imports = true
show_error_codes = true
pretty = true

# `lauren_di/_typing/forwardref.py` is a vendored descendant of the standalone
# `forwardref_evaluator` reference implementation, kept line-comparable with its
# upstream so the two can be diffed. Its `# type: ignore` comments were written
# for the mypy release that shipped it; three of them no longer suppress
# anything under 1.20.2, and deleting them would be the one kind of edit that
# makes the vendored copy diverge silently. The relaxation is scoped to that
# module and to that single rule: everything else in `strict` still applies, and
# the file is excluded from ruff, coverage and pyright for the same reason.
[[tool.mypy.overrides]]
module = ["lauren_di._typing.forwardref"]
warn_unused_ignores = false

# PRD 01 §5.6: "the typing test suite runs `mypy --strict` and `pyright` over
# the §5.4 examples and the public stubs". mypy's `files` above is the package;
# pyright is given the package plus the §5.4 fixtures, because those fixtures are
# where the *consumer* side of the contract is asserted.
#
# `typeCheckingMode = "strict"` turns on pyright's full rule set, including the
# `reportUnknown*` family: a value that decays to `Unknown` is exactly the
# regression the `resolve` overloads exist to prevent.
[tool.pyright]
include = ["lauren_di", "tests/typing"]
# Same rationale as the mypy override above: vendored, not part of the
# documented surface, and already excluded from ruff and coverage.
exclude = ["lauren_di/_typing/forwardref.py"]
typeCheckingMode = "strict"
pythonVersion = "3.10"
