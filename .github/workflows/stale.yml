name: stale

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: "stale"
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had
            recent activity. It will be closed in 14 days if no further activity occurs.
            If it is still relevant, leave a comment or remove the `stale` label.
          close-issue-message: |
            Closed because it has been stale for 14 days with no activity.
            Re-open with new information if it becomes relevant again.
          exempt-issue-labels: "pinned,security,good first issue,help wanted,roadmap"
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-label: "stale"
          stale-pr-message: |
            This pull request has been automatically marked as stale because it has not
            had recent activity. It will be closed in 14 days if no further activity occurs.
          close-pr-message: |
            Closed because it has been stale for 14 days with no activity.
            Re-open it if you pick the work back up.
          exempt-pr-labels: "pinned,security,blocked,wip"
          operations-per-run: 60
