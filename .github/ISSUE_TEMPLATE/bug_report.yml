name: Bug report
description: Report a defect - something does not work the way the docs, the type hints or llms-full.txt say it should.
title: "[bug]: <one-line summary>"
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Before filing, please:

        1. Search [open](https://github.com/lauren-framework/lauren-di/issues?q=is%3Aissue+is%3Aopen+label%3Abug) and [closed](https://github.com/lauren-framework/lauren-di/issues?q=is%3Aissue+is%3Aclosed+label%3Abug) bug reports.
        2. Reproduce on the latest release.
        3. Reduce it to the smallest self-contained snippet you can.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the defect.
      placeholder: e.g. "A REQUEST-scoped provider resolved inside container.scope() is rebuilt on every resolve."
    validations:
      required: true

  - type: textarea
    id: reproducer
    attributes:
      label: Minimal reproducer
      description: A snippet that can be pasted into a file and run with `python repro.py`.
      render: python
      placeholder: |
        from lauren_di import DIContainer, Scope, injectable
        # ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect, and why? Cite the docs, a type hint, or an `llms-full.txt` section where applicable.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead? Paste the full traceback, including the exception `code` and `detail` mapping for DI errors.
      render: text
    validations:
      required: true

  - type: input
    id: lauren-di-version
    attributes:
      label: lauren-di version
      description: Output of `python -c "import lauren_di; print(lauren_di.__version__)"`.
      placeholder: e.g. 0.1.0
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output of `python --version`.
      placeholder: e.g. 3.12.4
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "Critical: wrong instance lifecycle, or data returned from the wrong scope"
        - "High: a documented feature is broken, no workaround"
        - "Medium: a documented feature is broken, workaround exists"
        - "Low: incorrect message, type hint or documentation"
    validations:
      required: true

  - type: textarea
    id: regression
    attributes:
      label: Regression (if applicable)
      description: Did this work in an earlier version? Which one was the last good one?

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Anything else — container configuration, frameworks involved, related issues.

  - type: checkboxes
    id: terms
    attributes:
      label: Pre-flight checklist
      options:
        - label: I searched the existing issues and could not find a duplicate.
          required: true
        - label: My reproducer runs in a clean virtualenv against the version I list above.
          required: true
